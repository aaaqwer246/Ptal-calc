name = "ptal-api"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://aaaqwer246.github.io,https://ptal-calc.zhouguillaume111750.workers.dev,http://127.0.0.1:8765,http://localhost:8765"
DAILY_LIMIT = "1000"
MINUTE_LIMIT = "120"

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "QuotaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaGate"]
